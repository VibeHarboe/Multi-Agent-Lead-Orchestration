[pytest]
pythonpath = .
testpaths = eval
markers =
    llm: live tests that call the Claude API (opt-in; cost money; need ANTHROPIC_API_KEY)
    warehouse: live tests that hit the built NordLedger DuckDB warehouse (opt-in; need `dbt build` to have run)
    scenarios: exit-gate tests that assert every entry in warehouse/SCENARIOS.md
