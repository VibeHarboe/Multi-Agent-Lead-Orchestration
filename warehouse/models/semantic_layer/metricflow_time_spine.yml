version: 2

models:
  - name: metricflow_time_spine
    description: >
      Daily date spine required by MetricFlow for time-based metric
      aggregation (metric_time, monthly/quarterly grouping, time filters).
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: "One row per calendar day."
        granularity: day
        tests:
          - unique
          - not_null
