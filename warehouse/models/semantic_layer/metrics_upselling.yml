version: 2

# Upselling & Sales KPI metrics — the agent's query surface for monthly upsell
# performance. meta.level = sales (whiteboard taxonomy).
# Attach-rate-by-segment is a v2 item — see note in sem_upsell_events.yml.

metrics:
  - name: upsell_count
    label: "Upsell Count"
    description: "Count of successful upsell events (plan upgrades + add-on sales)."
    type: simple
    type_params:
      measure: upsell_count
    config:
      meta:
        level: sales
        owner: "BI / Vibe"
        source_mart: mart_upselling

  - name: total_incremental_revenue
    label: "Total Incremental Revenue"
    description: "Sum of incremental revenue generated by upsells."
    type: simple
    type_params:
      measure: total_incremental_revenue
    config:
      meta:
        level: sales
        owner: "BI / Vibe"
        source_mart: mart_upselling

  - name: plan_upgrades
    label: "Plan Upgrades"
    description: "Count of upsells that were plan upgrades."
    type: simple
    type_params:
      measure: plan_upgrades
    config:
      meta:
        level: sales
        owner: "BI / Vibe"
        source_mart: mart_upselling

  - name: add_on_sales
    label: "Add-on Sales"
    description: "Count of upsells that were add-on sales."
    type: simple
    type_params:
      measure: add_on_sales
    config:
      meta:
        level: sales
        owner: "BI / Vibe"
        source_mart: mart_upselling

  - name: upgrade_revenue
    label: "Plan Upgrade Revenue"
    description: "Incremental revenue from plan upgrades."
    type: simple
    type_params:
      measure: upgrade_revenue
    config:
      meta:
        level: sales
        owner: "BI / Vibe"
        source_mart: mart_upselling

  - name: add_on_revenue
    label: "Add-on Revenue"
    description: "Incremental revenue from add-on sales."
    type: simple
    type_params:
      measure: add_on_revenue
    config:
      meta:
        level: sales
        owner: "BI / Vibe"
        source_mart: mart_upselling

  - name: avg_incremental_revenue
    label: "Average Incremental Revenue per Upsell"
    description: >
      Average incremental revenue per upsell event:
      total_incremental_revenue / upsell_count.
    type: derived
    type_params:
      expr: "revenue / nullif(cnt, 0)"
      metrics:
        - name: total_incremental_revenue
          alias: revenue
        - name: upsell_count
          alias: cnt
    config:
      meta:
        level: sales
        owner: "BI / Vibe"
        source_mart: mart_upselling
        definition_version: "v1"
