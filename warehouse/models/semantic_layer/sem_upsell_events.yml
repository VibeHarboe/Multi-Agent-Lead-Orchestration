version: 2

semantic_models:
  - name: upsell_events
    description: >
      One row per successful upsell action — a plan upgrade or an add-on sale.
      Source for the monthly upsell-performance metrics in the Upselling & Sales
      domain. Joins to the customers semantic model via the `customer` entity.
      NOTE: attach-rate-by-segment is NOT modelled here — it needs an
      intermediate model of upsell-eligible customers (active + basic plan +
      tenure > upsell_min_tenure_days). That is a planned v2 addition
      (int_upsell_eligible_customers); see mart_upselling for the current logic.
    model: ref('stg_upsell_events')

    defaults:
      agg_time_dimension: upsold_at

    entities:
      - name: upsell
        type: primary
        expr: upsell_id
      - name: customer
        type: foreign
        expr: customer_id

    dimensions:
      - name: upsold_at
        type: time
        expr: upsell_date
        type_params:
          time_granularity: day
      - name: country
        type: categorical
      - name: upsell_type
        type: categorical
        description: "plan_upgrade, add_on_sale, or unknown."
      - name: sales_rep
        type: categorical
        description: "Sales rep credited with the upsell."
      - name: from_plan
        type: categorical
        description: "Plan the customer was on before the upsell."
      - name: to_plan
        type: categorical
        description: "Plan the customer moved to (equals from_plan for add-on sales)."

    measures:
      - name: upsell_count
        description: "Count of upsell events."
        agg: count
        expr: upsell_id
      - name: total_incremental_revenue
        description: "Sum of incremental revenue generated by upsells."
        agg: sum
        expr: incremental_revenue
      - name: plan_upgrades
        description: "Count of upsells that were plan upgrades."
        agg: sum
        expr: "case when upsell_type = 'plan_upgrade' then 1 else 0 end"
      - name: add_on_sales
        description: "Count of upsells that were add-on sales."
        agg: sum
        expr: "case when upsell_type = 'add_on_sale' then 1 else 0 end"
      - name: upgrade_revenue
        description: "Incremental revenue from plan upgrades."
        agg: sum
        expr: "case when upsell_type = 'plan_upgrade' then incremental_revenue else 0 end"
      - name: add_on_revenue
        description: "Incremental revenue from add-on sales."
        agg: sum
        expr: "case when upsell_type = 'add_on_sale' then incremental_revenue else 0 end"
